<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      background: #fff;
      color: #111827;
    }

    .header {
      padding: 12px 16px 10px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #6b7280;
      border-bottom: 1px solid #f3f4f6;
    }

    .open-search-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: calc(100% - 32px);
      margin: 12px 16px;
      padding: 9px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .open-search-btn:hover { background: #1d4ed8; }
    .open-search-btn:disabled {
      background: #d1d5db;
      color: #9ca3af;
      cursor: default;
    }

    .section-label {
      padding: 6px 16px 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
      border-top: 1px solid #f3f4f6;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f9fafb;
    }
    .row:last-child { border-bottom: none; padding-bottom: 12px; }

    .info { display: flex; flex-direction: column; gap: 1px; }
    .name { font-size: 13px; font-weight: 500; }
    .desc { font-size: 11px; color: #9ca3af; }

    .switch { position: relative; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .slider {
      display: block;
      width: 34px;
      height: 19px;
      background: #d1d5db;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      position: relative;
    }
    .slider::after {
      content: '';
      position: absolute;
      width: 13px;
      height: 13px;
      background: white;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    input:checked + .slider { background: #2563eb; }
    input:checked + .slider::after { transform: translateX(15px); }
  </style>
</head>
<body>
  <div class="header">GRM Forum Extension</div>

  <button id="open-search" class="open-search-btn">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
      <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
    </svg>
    Search in Thread
  </button>

  <div class="section-label">Features</div>

  <label class="row">
    <div class="info">
      <span class="name">Thread search</span>
      <span class="desc">Search all pages of the current thread</span>
    </div>
    <div class="switch"><input type="checkbox" id="s-search"><span class="slider"></span></div>
  </label>

  <label class="row">
    <div class="info">
      <span class="name">Auto-scroll to post</span>
      <span class="desc">Fix broken #post anchor links</span>
    </div>
    <div class="switch"><input type="checkbox" id="s-scroll"><span class="slider"></span></div>
  </label>

  <label class="row">
    <div class="info">
      <span class="name">Post link buttons</span>
      <span class="desc">Copy a direct link to any post</span>
    </div>
    <div class="switch"><input type="checkbox" id="s-links"><span class="slider"></span></div>
  </label>

  <label class="row">
    <div class="info">
      <span class="name">Show floating buttons</span>
      <span class="desc">Display gear and search icons on page</span>
    </div>
    <div class="switch"><input type="checkbox" id="s-floating"><span class="slider"></span></div>
  </label>

  <script src="popup.js"></script>
</body>
</html>
